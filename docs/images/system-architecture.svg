<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">System Architecture</title>
  <desc id="desc">Architecture diagram showing decision engine, explanation generation layers, output surfaces, monitoring components.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .header { font: 700 26px 'Segoe UI', sans-serif; fill: #0f172a; }
      .sub { font: 600 18px 'Segoe UI', sans-serif; fill: #1e293b; }
      .small { font: 500 14px 'Segoe UI', sans-serif; fill: #334155; }
      .box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
      .box2 { fill: #ecfeff; stroke: #67e8f9; stroke-width: 2; }
      .box3 { fill: #f0fdf4; stroke: #86efac; stroke-width: 2; }
      .box4 { fill: #fefce8; stroke: #facc15; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .label { font: 600 15px 'Segoe UI', sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="700"/>

  <rect class="panel" x="300" y="25" width="600" height="80" rx="12"/>
  <text x="600" y="75" text-anchor="middle" class="header">Cost-Sensitive Decision Engine</text>
  <text x="600" y="95" text-anchor="middle" class="small">~2ms authorization path</text>

  <line class="arrow" x1="600" y1="105" x2="600" y2="150"/>

  <rect class="panel" x="120" y="160" width="960" height="230" rx="14"/>
  <text x="600" y="195" text-anchor="middle" class="sub">Explanation Generation (Async)</text>

  <rect class="box" x="170" y="220" width="220" height="110" rx="12"/>
  <text x="280" y="260" text-anchor="middle" class="label">Layer 1: Tabular</text>
  <text x="280" y="285" text-anchor="middle" class="small">Attribution</text>
  <text x="280" y="305" text-anchor="middle" class="small">(SHAP)</text>

  <rect class="box2" x="450" y="220" width="220" height="110" rx="12"/>
  <text x="560" y="260" text-anchor="middle" class="label">Layer 2: Graph</text>
  <text x="560" y="285" text-anchor="middle" class="small">Attribution</text>
  <text x="560" y="305" text-anchor="middle" class="small">(Template-Based)</text>

  <rect class="box3" x="730" y="220" width="220" height="110" rx="12"/>
  <text x="840" y="260" text-anchor="middle" class="label">Layer 3: Reason</text>
  <text x="840" y="285" text-anchor="middle" class="small">Ranking &amp; Selection</text>
  <text x="840" y="305" text-anchor="middle" class="small">(Top-3, Dedup)</text>

  <line class="arrow" x1="390" y1="275" x2="450" y2="275"/>
  <line class="arrow" x1="670" y1="275" x2="730" y2="275"/>

  <rect class="panel" x="120" y="410" width="960" height="140" rx="14"/>
  <text x="600" y="445" text-anchor="middle" class="sub">Output Surfaces</text>

  <rect class="box4" x="180" y="470" width="210" height="60" rx="12"/>
  <text x="285" y="507" text-anchor="middle" class="label">Investigator UI</text>
  <text x="285" y="525" text-anchor="middle" class="small">Case view + agreement</text>

  <rect class="box4" x="470" y="470" width="210" height="60" rx="12"/>
  <text x="575" y="507" text-anchor="middle" class="label">Compliance</text>
  <text x="575" y="525" text-anchor="middle" class="small">Export (CSV + JSON)</text>

  <rect class="box4" x="760" y="470" width="210" height="60" rx="12"/>
  <text x="865" y="507" text-anchor="middle" class="label">Customer Message</text>
  <text x="865" y="525" text-anchor="middle" class="small">Filtered, policy-gated</text>

  <line class="arrow" x1="600" y1="390" x2="600" y2="410"/>
  <line class="arrow" x1="390" y1="500" x2="470" y2="500"/>
  <line class="arrow" x1="680" y1="500" x2="760" y2="500"/>

  <rect class="panel" x="120" y="570" width="960" height="95" rx="14"/>
  <text x="600" y="605" text-anchor="middle" class="sub">MLOps &amp; Monitoring</text>

  <rect class="box2" x="215" y="620" width="200" height="20" rx="8"/>
  <text x="315" y="636" text-anchor="middle" class="small">Faithfulness Tester</text>

  <rect class="box2" x="480" y="620" width="200" height="20" rx="8"/>
  <text x="580" y="636" text-anchor="middle" class="small">Precision Drift</text>

  <rect class="box2" x="745" y="620" width="200" height="20" rx="8"/>
  <text x="845" y="636" text-anchor="middle" class="small">Business Impact Metrics</text>
</svg>
