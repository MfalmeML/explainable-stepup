<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Monitoring Overview</title>
  <desc id="desc">Monitoring overview showing coverage, explanation drift, faithfulness and model precision metrics.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .box { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 2; }
      .box2 { fill: #dcfce7; stroke: #4ade80; stroke-width: 2; }
      .box3 { fill: #fef3c7; stroke: #fbbf24; stroke-width: 2; }
      .text { font: 600 18px 'Segoe UI', sans-serif; fill: #0f172a; }
      .small { font: 500 14px 'Segoe UI', sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>
  <rect class="bg" width="1200" height="500"/>

  <rect class="panel" x="80" y="40" width="1040" height="80" rx="14"/>
  <text x="600" y="88" text-anchor="middle" class="text">MLOps &amp; Monitoring Layer</text>

  <rect class="box" x="120" y="180" width="230" height="180" rx="12"/>
  <text x="235" y="222" text-anchor="middle" class="text">Coverage</text>
  <text x="235" y="250" text-anchor="middle" class="small">with_explanation /</text>
  <text x="235" y="272" text-anchor="middle" class="small">non_approve decisions</text>
  <text x="235" y="310" text-anchor="middle" class="small">Alert if &lt; 95%</text>

  <rect class="box2" x="420" y="180" width="230" height="180" rx="12"/>
  <text x="535" y="222" text-anchor="middle" class="text">Faithfulness</text>
  <text x="535" y="250" text-anchor="middle" class="small">Counterfactual checks</text>
  <text x="535" y="272" text-anchor="middle" class="small">Verify reason effect</text>
  <text x="535" y="310" text-anchor="middle" class="small">Pass rate &gt; 80%</text>

  <rect class="box3" x="720" y="180" width="230" height="180" rx="12"/>
  <text x="835" y="222" text-anchor="middle" class="text">Precision Drift</text>
  <text x="835" y="250" text-anchor="middle" class="small">Step-up completion</text>
  <text x="835" y="272" text-anchor="middle" class="small">Rate by bucket</text>
  <text x="835" y="310" text-anchor="middle" class="small">Alert when shift &gt; 15%</text>

  <line class="arrow" x1="350" y1="270" x2="420" y2="270"/>
  <line class="arrow" x1="650" y1="270" x2="720" y2="270"/>
</svg>
